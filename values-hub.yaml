      annotations:
        argocd.argoproj.io/sync-wave: "37"
    qtodo:
      name: qtodo
      namespace: qtodo
      argoProject: hub
      path: charts/qtodo
      annotations:
        argocd.argoproj.io/sync-wave: "38"
