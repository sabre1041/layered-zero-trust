        value: "true"
      - name: central.exposure.route.reencrypt.host
        value: "central.{{ $.Values.global.localClusterDomain }}"
      - name: integration.keycloak.enabled
        value: "true"
      - name: integration.keycloak.realm
        value: "ztvp"
      - name: integration.keycloak.clientId
        value: "acs-central"
      - name: clusterName
        value: hub
      extraValueFiles:
      - /values-global.yaml
      - /values-{{ .Values.global.pattern }}-hub.yaml
      ignoreDifferences:
      - group: platform.stackrox.io
        kind: Central
        jsonPointers:
        - /spec/scanner/scannerComponent
      annotations:
        argocd.argoproj.io/sync-wave: "41"
    acs-secured-cluster:
      name: acs-secured-cluster
      namespace: stackrox
      argoProject: hub
      path: charts/acs-secured-cluster
      overrides:
      - name: clusterName
        value: hub
      extraValueFiles:
      - /values-global.yaml
      - /values-{{ .Values.global.pattern }}-hub.yaml
      annotations:
        argocd.argoproj.io/sync-wave: "46"
    acs-policies:
      name: acs-policies
      namespace: stackrox
      argoProject: hub
      path: charts/acs-policies
      annotations:
        argocd.argoproj.io/sync-wave: "51"
    noobaa-mcg:
      name: noobaa-mcg
      namespace: openshift-storage
      project: hub
      path: charts/noobaa-mcg
      annotations:
        argocd.argoproj.io/sync-wave: "36"
    netobserv:
