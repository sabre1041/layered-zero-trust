        - /spec/agent/ebpf/excludeInterfaces
        - /spec/agent/ebpf/imagePullPolicy
        - /spec/agent/ebpf/kafkaBatchSize
        - /spec/agent/ebpf/logLevel
        - /spec/agent/ebpf/metrics
        - /spec/agent/ebpf/resources
        - /spec/agent/ipfix
        - /spec/consolePlugin/autoscaler
        - /spec/consolePlugin/imagePullPolicy
        - /spec/consolePlugin/logLevel
        - /spec/consolePlugin/portNaming
        - /spec/consolePlugin/quickFilters
        - /spec/consolePlugin/replicas
        - /spec/consolePlugin/resources
        - /spec/execution
        - /spec/kafka
        - /spec/loki/manual
        - /spec/loki/microservices
        - /spec/loki/monolithic
        - /spec/loki/readTimeout
        - /spec/loki/writeBatchSize
        - /spec/loki/writeBatchWait
        - /spec/loki/writeTimeout
        - /spec/processor
        - /spec/prometheus
  argoCD:
    resourceHealthChecks:
    - check: |
        local hs = {}
        if obj.status ~= nil and obj.status.phase ~= nil then
          if obj.status.phase == "Bound" then
            hs.status = "Healthy"
            hs.message = "PVC is bound"
          elseif obj.status.phase == "Pending" then
            hs.status = "Healthy"
            hs.message = "PVC is pending"
          elseif obj.status.phase == "Lost" then
            hs.status = "Degraded"
            hs.message = "PVC is lost"
          else
            hs.status = "Progressing"
            hs.message = obj.status.phase
          end
        else
          hs.status = "Progressing"
          hs.message = "Waiting for PVC status"
        end
        return hs
      kind: PersistentVolumeClaim
    - check: |
        local hs = {}
        hs.status = "Progressing"
        hs.message = "Waiting for status update."
        if obj.status ~= nil then
          if obj.status.conditions ~= nil then
            for i, condition in ipairs(obj.status.conditions) do
              if condition.type == "Done" and condition.status == "True" then
                hs.status = "Healthy"
                hs.message = condition.message
                return hs
              end
              if condition.type == "Started" and condition.status == "True" then
                hs.status = "Progressing"
                hs.message = "Realm import is running"
                return hs
              end
              if condition.type == "HasErrors" and condition.status == "True" then
                hs.status = "Degraded"
                hs.message = condition.message
                return hs
              end
            end
          end
        end
        return hs
      group: k8s.keycloak.org
      kind: KeycloakRealmImport
    - check: |
        local hs = {}
        hs.status = "Progressing"
        hs.message = "Waiting for application status"
        if obj.status ~= nil and obj.status.health ~= nil then
          hs.status = obj.status.health.status
          if obj.status.health.message ~= nil then
            hs.message = obj.status.health.message
          end
        end
        return hs
      group: argoproj.io
      kind: Application
    resourceExclusions: |
      - apiGroups:
        - internal.open-cluster-management.io
        kinds:
        - ManagedClusterInfo
        clusters:
        - "*"
      - apiGroups:
        - tekton.dev
        kinds:
        - TaskRun
        - PipelineRun

  imperative:
    # NOTE: We *must* use lists and not hashes. As hashes lose ordering once parsed by helm
    # The default schedule is every 10 minutes: imperative.schedule
    # Total timeout of all jobs is 1h: imperative.activeDeadlineSeconds
    # imagePullPolicy is set to always: imperative.imagePullPolicy
    jobs: []
