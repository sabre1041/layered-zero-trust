        argocd.argoproj.io/sync-wave: '1'
      argoProject: hub
      chart: ocp-compliance-scanning
      chartVersion: 0.0.*
      overrides:
      - name: compliance.storage.enabled
        value: "false"
    vault:
      name: vault
      namespace: vault
      argoProject: hub
      chart: hashicorp-vault
      chartVersion: 0.1.*
      extraValueFiles:
      - /overrides/values-vault-network-policy.yaml
      annotations:
        argocd.argoproj.io/sync-wave: "25"
    openshift-external-secrets:
      name: openshift-external-secrets
      namespace: external-secrets
      argoProject: hub
